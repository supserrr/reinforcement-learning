<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b9cfe0">
<title>Drone Delivery RL</title>
<link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/"
} }
</script>
</head>
<body>
<div id="scene"></div>

<section class="card shift" aria-label="Shift">
  <h1 id="agent">Waiting for Agent</h1>

  <div class="clock-row">
    <span class="clock" id="clock">08:00</span>
    <span class="meta" id="episode"></span>
  </div>
  <div class="progress" aria-hidden="true"><div id="timeline-fill"></div></div>

  <dl class="rows">
    <div class="row battery">
      <dt>Battery</dt>
      <dd><span class="bar" aria-hidden="true"><span id="battery-fill"></span></span><span class="num" id="battery">100<small>%</small></span></dd>
    </div>
    <div class="row"><dt>Cargo</dt><dd class="num" id="cargo">0 of 2</dd></div>
    <div class="row"><dt>Wind</dt><dd class="num" id="wind">0<small>km/h</small></dd></div>
    <div class="row"><dt>Return</dt><dd class="num strong" id="score">0.0</dd></div>
  </dl>

  <table class="tally">
    <thead><tr><th></th><th>Delivered</th><th>Missed</th></tr></thead>
    <tbody>
      <tr><th>Emergency</th><td class="num" id="d-e">0</td><td class="num" id="m-e">0</td></tr>
      <tr><th>Routine</th><td class="num" id="d-r">0</td><td class="num" id="m-r">0</td></tr>
    </tbody>
  </table>

  <p class="hint">Press F to follow the drone, O to orbit</p>
</section>

<section class="card decisions" aria-label="Decisions">
  <h2>Decisions</h2>
  <ol id="log"></ol>
</section>

<div id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
